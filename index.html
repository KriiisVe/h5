<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Хеллоуин-квест по математике</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Wet+Paint&family=Rubik:ital,wght@0,500;0,700;0,900;1,700;1,900&display=swap">
<style>
/* Ночная сцена квеста: тёмное небо, пергаментные карточки, тыквенный акцент; мгновенная проверка у каждого ответа */
:root{
  --night:#170b24; --night2:#24113a; --panel:#2c1746; --line:#4a2d6b;
  --parch:#f6e7bd; --parch2:#e6cf94; --ink:#24120a; --ink2:#6a4a2a; --wood:#5c3a12;
  --pumpkin:#ff8a1f; --pumpkin2:#ffb35c; --slime:#9dff5a; --violet:#c79bff; --blood:#ff6b6b;
  --okbg:#dff7c9; --okbd:#2f8f1c; --badbg:#ffd9d6; --badbd:#c0262f;
  --text:#f2e9ff; --muted:#bfa9dc;
  --display:'Rubik Wet Paint','Rubik',system-ui,sans-serif;
  --body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--night)}
body{background:radial-gradient(ellipse at 50% 0%,#3a1858 0%,var(--night2) 40%,var(--night) 100%) fixed,var(--night);
  color:var(--text);font-family:var(--body);font-size:17px;line-height:1.45;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,.wet{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance}
h1{font-size:clamp(34px,7vw,64px);color:var(--pumpkin);text-align:center;margin:8px 0 4px;text-shadow:0 0 24px rgba(255,138,31,.45),0 4px 0 #5a1d00}
h2{font-size:clamp(28px,5vw,42px);color:var(--pumpkin);margin:0;text-shadow:0 3px 0 #5a1d00}
.sub{text-align:center;color:var(--muted);margin:0 0 18px}
sup{font-size:.62em;line-height:0;position:relative;top:-.15em}
button{font-family:var(--body);cursor:pointer}
:focus-visible{outline:3px solid var(--slime);outline-offset:2px}

.steps{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0 18px}
.steps button{border:2px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.steps button.on{border-color:var(--pumpkin);color:#fff;background:#4a2560}
.steps button.done::after{content:" ✓";color:var(--slime)}

.task{background:rgba(30,12,50,.9);border:3px solid var(--pumpkin2);border-radius:22px;padding:14px 18px;text-align:center;margin:12px 0 18px}
.task b{color:var(--pumpkin2)}
.card{background:linear-gradient(var(--parch),var(--parch2));color:var(--ink);border:5px solid var(--wood);border-radius:20px;box-shadow:0 5px 0 var(--wood)}
.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:16px;padding:13px 22px;font-weight:900;font-size:18px;background:var(--pumpkin);color:#2b1000;box-shadow:0 4px 0 #8a3c00}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #8a3c00}
.btn.ghost{background:var(--panel);color:var(--text);box-shadow:0 4px 0 #120820;border:2px solid var(--line)}
.btn.green{background:var(--slime);color:#123000;box-shadow:0 4px 0 #2f6b10}
.btn.sm{padding:8px 14px;font-size:16px;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* feedback */
.fb{border-radius:12px;padding:8px 12px;margin-top:8px;font-weight:500;font-size:15.5px;line-height:1.4}
.fb.bad{background:var(--badbg);color:#5a0d12;border:2px solid var(--badbd)}
.fb.ok{background:var(--okbg);color:#163d08;border:2px solid var(--okbd)}
.fb.show{background:#efe3ff;color:#2b1446;border:2px solid #6b2f86}
.fb b{font-weight:900}
.status-ok{color:var(--okbd);font-weight:900}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shake{animation:shake .4s}

/* sorter */
.sorter{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.zone{border:4px dashed var(--line);border-radius:22px;min-height:170px;padding:10px;transition:border-color .15s,background .15s}
.zone.hot,.zone.target{border-color:var(--slime);background:rgba(157,255,90,.08)}
.zone .zl{font-family:var(--display);font-size:24px;text-align:center;color:var(--violet)}
.zone .items{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:60px}
.shelf{grid-column:1/-1;border:3px solid var(--wood);background:rgba(92,58,18,.25)}
.shelf .zl{color:var(--pumpkin2)}
.kwrap{position:relative;width:min(100%,250px);margin:0 auto}
.kwrap img{width:100%;display:block}
.kwrap .kn{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);font-weight:900;font-size:clamp(26px,9vw,52px);color:var(--slime)}
.kwrap.violet .kn{color:#e2b0ff}
.zimg{display:block;margin:0 auto;width:min(100%,220px)}
.item{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;background:none;border:3px solid transparent;border-radius:16px;padding:2px;width:clamp(96px,24vw,132px);display:flex;flex-direction:column;align-items:center;color:var(--ink)}
.item img{width:78%;display:block;pointer-events:none}
.item .tag{margin-top:-6px;background:linear-gradient(#fbefc9,#ead196);border:3px solid var(--wood);border-radius:12px;padding:2px 10px;font-weight:900;font-size:clamp(17px,4.4vw,24px);white-space:nowrap;box-shadow:0 3px 0 var(--wood);pointer-events:none}
.bats .item{width:clamp(130px,40vw,190px)}
.bats .item img{width:70%}
.item.sel{border-color:var(--slime);background:rgba(157,255,90,.15)}
.item.locked{cursor:default}
.item.locked .tag{border-color:var(--okbd);background:var(--okbg)}
.item.locked::after{content:"✓";position:absolute;top:0;right:4px;background:var(--okbd);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-weight:900;font-size:15px}
.dragghost{position:fixed;pointer-events:none;z-index:50;opacity:.9;transform:translate(-50%,-50%) scale(1.05);width:110px}
.hint-tap{color:var(--muted);font-size:14px;text-align:center;margin-top:8px}
.sfb{margin-top:12px}

/* tower */
.tower{display:flex;gap:8px;justify-content:center;margin:0 0 16px}
.win{width:46px;height:58px;border-radius:22px 22px 6px 6px;background:#2a1838;border:3px solid var(--line);display:grid;place-items:center;font-weight:900;color:var(--muted)}
.win.lit{background:#ffcf4a;border-color:#ff8a1f;color:#3b1400;box-shadow:0 0 18px rgba(255,207,74,.6)}
.floor{padding:14px 18px;min-width:0}
.floor h3{color:#6b2f86;font-size:clamp(22px,4.5vw,30px);margin:0 0 4px}
.floor.locked{opacity:.6;filter:grayscale(.4)}
.lockmsg{margin:4px 0 0;font-weight:700;color:var(--ink2)}
.floor .eq{border-top:2px dashed rgba(92,58,18,.35);padding-top:10px;margin-top:10px}
.floor .eq .e{font-weight:900;font-size:clamp(20px,5vw,26px);overflow-wrap:anywhere}
/* problems & equations */
.plist{display:grid;gap:14px}
.prob{padding:14px 18px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.prob>div{min-width:0}
.prob .n{width:44px;height:44px;border-radius:50%;background:var(--wood);color:#ffe9c9;display:grid;place-items:center;font-weight:900}
.prob.star{border-color:#6b2f86;box-shadow:0 5px 0 #6b2f86}.prob.star .n{background:#6b2f86}
.prob p{margin:0 0 10px;font-weight:500}
.ask{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 0;font-weight:700;color:var(--ink2)}
.ask input{width:110px;font:900 21px var(--body);padding:6px 10px;border:3px dashed #8a6a3a;border-radius:12px;background:rgba(255,255,255,.6);color:var(--ink)}
.ask input.good{border:3px solid var(--okbd);background:var(--okbg)}
.ask input[disabled]{opacity:1;-webkit-text-fill-color:var(--ink)}
.pt{font-size:18px;font-weight:700;margin:0 0 6px;line-height:1.4}
.bars{margin:12px 0 4px;display:grid;gap:6px;font-weight:700}
.brow{display:grid;grid-template-columns:minmax(80px,auto) 1fr;gap:10px;align-items:center}
.blab{font-size:14px;color:var(--ink2);text-align:right}
.blocks{display:flex;gap:3px;flex-wrap:wrap}
.blk{width:clamp(30px,8vw,44px);height:30px;border-radius:6px;border:2px solid #3b1f08;display:grid;place-items:center;font-size:13px;font-weight:900}
.blk.b1{background:#ff9a2e}.blk.b2{background:#c79bff}
.btot{font-size:14px;color:var(--ink2);margin-left:90px}
.tw-layout{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start}
.tw-art svg{width:100%;height:auto;display:block;overflow:visible}
.tw-art{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px)}
@media (max-width:700px){.tw-layout{grid-template-columns:1fr}.tw-art{position:static;width:120px;margin:0 auto}}

.intro{max-width:580px;margin:0 auto;padding:22px;text-align:center}
.intro input{width:100%;font:700 22px var(--body);padding:12px 14px;border-radius:14px;border:3px solid var(--wood);background:#fff8e6;color:var(--ink);margin:10px 0 16px}
.intro ul{text-align:left;margin:0 0 16px;padding-left:22px}
.res{padding:20px;text-align:center}
.score{font-family:var(--display);font-size:clamp(48px,12vw,96px);line-height:1;margin:6px 0}
.score.ok{color:#2f8f1c}.score.bad{color:#c25a00}
.rows{display:grid;gap:8px;margin:16px 0;text-align:left}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;background:rgba(255,255,255,.45);border-radius:12px;padding:10px 14px;font-weight:700}
.row .h{grid-column:1/-1;font-weight:500;font-size:15px;color:var(--ink2)}
.row.miss{background:rgba(255,107,107,.18)}
.report{white-space:pre-wrap;text-align:left;background:#fff8e6;color:var(--ink);border:2px dashed #8a6a3a;border-radius:12px;padding:12px;font:500 14.5px/1.45 ui-monospace,Menlo,Consolas,monospace;user-select:all;margin:10px 0;overflow-wrap:anywhere}
.todo{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.tnum{font-variant-numeric:tabular-nums}
@media (max-width:620px){.zone .zl{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  <h1>Хеллоуин-квест</h1>
  <p class="sub">Степени, уравнения и задачи на части — 5 класс</p>

  <main id="view"></main>
</div>

        if(P.big&&v===one) return `Это 1 часть. А спрашивают про ${P.lab[1]} — это ${P.k} ${pw}.`;
        if(!P.big&&v===P.p*P.k) return `Это ${P.lab[1]}. А спрашивают про ${P.lab[0]} — 1 часть.`;
        return `1 часть = ${P.n} : ${P.parts}. Посчитай ещё раз.`;
      },()=>render(true),{solution:()=>P.big?`${P.n} : ${P.parts} = ${one}, ${one} · ${P.k} = ${P.ans}`:`${P.n} : ${P.parts} = ${P.ans}`,okText:()=>'Верно!'}));
    }
    list.append(h('div',{class:'card prob'},h('div',{class:'n'},String(i+1)),body));
  });
  view.append(list,nav());
}
const probOk=i=>it('prp-'+i).ok&&it('pr-'+i).ok;

/* ---------- tower ---------- */
function lhsAt(l,v){return l.replace(/(\d)x/g,'$1 · x').replace(/\bx\b/g,String(v));}
function substitute(eq,v){const [l,r]=eq.t.split(' = ');const sl=lhsAt(l,v);const lv=val(sl);
  return Number.isInteger(lv)&&lv>=0?`Подставим x = ${v}: ${fmt(sl)} = ${lv}, а должно быть ${r}.`:`Подставим x = ${v}: ${fmt(sl)} — нацело не получается, а должно быть ${r}.`;}
const floorDone=f=>towerIds()[f].every(i=>it(i).done);
const curFloor=()=>{const f=G.tower.findIndex((_,i)=>!floorDone(i));return f<0?4:f;};
let viewFloor=null;
function towerSVG(){
  const W=260,H=600,x0=60,x1=200,fh=84,top=150; // floor 5 at top
  const NS='http://www.w3.org/2000/svg';
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Башня ведьмы"><defs>
  <pattern id="brick" width="28" height="16" patternUnits="userSpaceOnUse"><rect width="28" height="16" fill="#4a4458"/><path d="M0 0H28M0 8H28M14 0V8M0 8V16M28 8V16" stroke="#2c2836" stroke-width="2"/></pattern>
  <radialGradient id="glw"><stop offset="0" stop-color="#ffd23b" stop-opacity=".8"/><stop offset="1" stop-color="#ffd23b" stop-opacity="0"/></radialGradient></defs>`;
  // bats
  const bat='M50 30 C45 20 35 15 20 18 C25 22 26 28 22 32 C15 28 6 30 0 36 C10 36 18 42 22 48 C30 42 40 42 46 46 L50 40 L54 46 C60 42 70 42 78 48 C82 42 90 36 100 36 C94 30 85 28 78 32 C74 28 75 22 80 18 C65 15 55 20 50 30Z';
  s+=`<path d="${bat}" transform="translate(196 70) scale(.5)" fill="#0d0617"/><path d="${bat}" transform="translate(8 190) scale(.38)" fill="#0d0617"/>`;
  // roof
  s+=`<path d="M${x0-18} ${top} L130 18 L${x1+18} ${top}Z" fill="#5b2a86" stroke="#2a1040" stroke-width="5" stroke-linejoin="round"/>`;
  s+=`<path d="M130 18 V-2" stroke="#2a1040" stroke-width="4"/><path d="M130 -2 L156 6 L130 14Z" fill="#ff8a1f"/>`;
  const allDone=G.tower.every((_,f)=>floorDone(f));
  // roof window
  s+=`<path d="M114 128 V104 Q130 86 146 104 V128Z" fill="${allDone?'#ffd23b':'#1a0f24'}" stroke="#2a1040" stroke-width="4"/>`;
  if(allDone) s+=`<path d="M118 128 L118 112 L123 104 L127 112 L133 112 L137 104 L142 112 L142 128Z" fill="#1b1424"/><circle cx="125" cy="117" r="2.4" fill="#ffd23b"/><circle cx="135" cy="117" r="2.4" fill="#ffd23b"/>`;
  // body
  s+=`<rect x="${x0}" y="${top}" width="${x1-x0}" height="${fh*5+10}" fill="url(#brick)" stroke="#1c1824" stroke-width="5"/>`;
  const cur=curFloor(), vf=viewFloor??cur;
  for(let f=0;f<5;f++){
    const y=top+(4-f)*fh; const done=floorDone(f), open=f===0||floorDone(f-1);
    if(f<4) s+=`<rect x="${x0-8}" y="${y+fh-4}" width="${x1-x0+16}" height="10" rx="3" fill="#2c2836"/>`;
    const fill=done?'#ffd23b':open?'#ff8a1f':'#1a0f24';
    if(done) s+=`<circle cx="130" cy="${y+40}" r="44" fill="url(#glw)"/>`;
    s+=`<g class="twf" data-f="${f}" style="cursor:${open?'pointer':'default'}">`;
    s+=`<rect x="${x0}" y="${y}" width="${x1-x0}" height="${fh}" fill="transparent"/>`;
    s+=`<path d="M108 ${y+66} V${y+30} Q130 ${y+6} 152 ${y+30} V${y+66}Z" fill="${fill}" stroke="${f===vf?'#9dff5a':'#1c1824'}" stroke-width="${f===vf?6:4}"/>`;
    s+=`<path d="M130 ${y+18} V${y+66} M108 ${y+44} H152" stroke="#1c1824" stroke-width="3"/>`;
    if(!open) s+=`<rect x="122" y="${y+38}" width="16" height="13" rx="2" fill="#8a7a9a"/><path d="M125 ${y+38} V${y+33} Q130 ${y+27} 135 ${y+33} V${y+38}" stroke="#8a7a9a" stroke-width="3" fill="none"/>`;
    s+=`<rect x="${x0+6}" y="${y+28}" width="26" height="24" rx="6" fill="#170b24"/><text x="${x0+19}" y="${y+46}" text-anchor="middle" font-family="Rubik,sans-serif" font-weight="900" font-size="17" fill="${done?'#9dff5a':'#e9dcff'}">${f+1}</text>`;
    s+=`</g>`;
  }
  // door + ground
  const yb=top+fh*5+10;
  s+=`<path d="M0 ${yb+8} Q130 ${yb-16} 260 ${yb+8} V${H} H0Z" fill="#0d0617"/>`;
  s+=`<path d="M114 ${yb} V${yb-22} Q130 ${yb-38} 146 ${yb-22} V${yb}Z" fill="#2a1608" stroke="#1c1824" stroke-width="3"/>`;
  s+=`</svg>`;
  return s;
}
function tower(){
  view.append(h('h2',{},'Башня уравнений'),h('div',{class:'task',html:'Поднимись на вершину: каждый этаж открывается, когда решишь предыдущий.'}));
  const cur=curFloor(); if(viewFloor==null||!(viewFloor===0||floorDone(viewFloor-1))) viewFloor=cur;
  const f=viewFloor, F=G.tower[f];
  const art=h('div',{class:'tw-art',html:towerSVG()});
  art.querySelectorAll('.twf').forEach(g=>g.addEventListener('click',()=>{const n=+g.dataset.f;if(n===0||floorDone(n-1)){viewFloor=n;render(true);}}));
  const card=h('section',{class:'card floor'},h('h3',{},`Этаж ${f+1}. ${F.name}`));
  if(F.eqs) F.eqs.forEach((eq,i)=>{const id=`t-${f}-${i}`;
    card.append(h('div',{class:'eq'},h('div',{class:'e',html:fmt(eq.t)}),
      asker(id,'<i>x</i> = ',eq.r,(v,t)=>substitute(eq,v)+' '+EQ_RULE[eq.rule]+(t===2?' Ещё ошибка — покажу решение.':''),afterAnswer,
        {solution:()=>`Решение: ${fmt(eq.steps)}.`,okText:()=>`Верно! ${fmt(lhsAt(eq.t.split(' = ')[0],eq.r))} = ${eq.t.split(' = ')[1]}`})));});
  if(F.chk) F.chk.forEach((c,i)=>{const id=`t-${f}-${i}`,st=it(id);
    const [l,r]=c.eq.t.split(' = ');const sl=lhsAt(l,c.cand);const lv=val(sl);
    const why=`${fmt(sl)} ${Number.isInteger(lv)?'= '+lv:'— нацело не делится'}${c.isRoot?', равенство верное.':', а нужно '+r+'.'}`;
    const box=h('div',{class:'eq'},h('div',{class:'e',html:`x = ${c.cand} — корень уравнения ${fmt(c.eq.t)}?`}));
    const fbx=h('div',{role:'status'});
    if(st.done) fbx.append(h('div',{class:'fb '+(st.ok?'ok':'show'),html:(st.ok?'Верно! ':(c.isRoot?'Это корень: ':'Не корень: '))+why}));
    const yes=h('button',{class:'btn sm',disabled:st.done},'Да'),no=h('button',{class:'btn sm ghost',disabled:st.done},'Нет');
    const ans=a=>{if(a===c.isRoot)right(id);else{wrong(id);reveal(id);}afterAnswer();};
    yes.onclick=()=>ans(true);no.onclick=()=>ans(false);
    box.append(h('div',{class:'ask'},yes,no),fbx);card.append(box);});
  if(floorDone(f)&&f<4) card.append(h('button',{class:'btn green',style:'margin-top:14px',onclick:()=>{viewFloor=f+1;render();}},`Этаж ${f+1} пройден! Наверх →`));
  if(G.tower.every((_,i)=>floorDone(i))) card.append(h('div',{class:'fb ok',style:'margin-top:14px;font-weight:900;text-align:center'},'Ты на вершине башни! Котик ведьмы тебя встречает.'));
  view.append(h('div',{class:'tw-layout'},art,card),nav());
}
function afterAnswer(){render(true);}

/* ---------- ending ---------- */
function score(){
  const SI=sectionItems(), per={}; let got=0,max=0;
  for(const sec of SECTIONS){const ids=SI[sec.id];
    const ok=sec.id==='pr'?G.problems.filter((_,i)=>probOk(i)).length:ids.filter(i=>it(i).ok).length;
    per[sec.id]={ok,max:ids.length};got+=ok;max+=ids.length;}
  return {per,got,max,pct:Math.round(got/max*100)};
}
const SUPD='⁰¹²³⁴⁵⁶⁷⁸⁹';const sup=s=>String(s).replace(/(\d+)\^(\d+)/g,(m,b,e)=>b+[...e].map(d=>SUPD[d]).join(''));
function mistakes(){
  const out=[];
  G.cauldrons.forEach((C,ci)=>C.items.forEach((x,i)=>{const s=it(`c${ci}-${i}`);if(s.tries)out.push(`Котёл ${C.T}: ${sup(x.e)} — ${x.ok?'нужно было в котёл':'нужно было в гадости'}`);}));
  G.bats.forEach((b,i)=>{if(it('bat-'+i).tries)out.push(`Мыши: ${sup(b.s)} (${b.ok?'верно':'неверно'})`);});
  G.problems.forEach((P,i)=>{const a=it('prp-'+i),b=it('pr-'+i);if(a.tries||b.tries)out.push(`Задача ${i+1}: ${a.tries?'части ×'+a.tries:''}${a.tries&&b.tries?', ':''}${b.tries?'ответ ×'+b.tries:''}${a.shown||b.shown?' (показано решение)':''}`);});
  G.tower.forEach((F,f)=>(F.eqs||F.chk).forEach((q,i)=>{const x=it(`t-${f}-${i}`);if(!x.tries)return;
    out.push(F.eqs?`Этаж ${f+1}: ${sup(q.t)} — ошибок ${x.tries}${x.shown?' (показано решение)':''}`:`Этаж 3: «${q.cand} — корень ${q.eq.t}?» — ответила неверно`);}));
  return out;
}
function ending(){
  const SI=sectionItems(); const left=SECTIONS.filter(s=>!SI[s.id].every(i=>it(i).done));
  if(left.length){
    view.append(h('section',{class:'card res'},h('h2',{style:'color:#6b2f86;text-shadow:none'},'Ещё не всё'),
      h('p',{},'Чтобы увидеть результат, закончи эти главы:'),
      h('div',{class:'todo'},left.map(s=>h('button',{class:'btn sm',onclick:()=>go(STEPS.indexOf(s.id))},s.name())))),
      h('div',{class:'navrow'},h('button',{class:'btn ghost',onclick:()=>go(4)},'← Назад'),h('span')));
    return;
  }
  const sc=score(); const ok=sc.pct>=PASS;
  if(!S.history.find(x=>x.attempt===S.attempt)){S.history.push({attempt:S.attempt,pct:sc.pct,got:sc.got,max:sc.max,mins:Math.max(1,Math.round((Date.now()-S.start)/60000)),at:Date.now()});save();}
  const rec=S.history.find(x=>x.attempt===S.attempt);
  const box=h('section',{class:'card res'});
  box.append(h('h2',{style:'color:#6b2f86;text-shadow:none'},ok?'Квест пройден!':'Почти получилось'));
  box.append(h('div',{class:'score '+(ok?'ok':'bad')+' tnum'},sc.pct+'%'));
  box.append(h('p',{style:'margin:0;font-weight:700'},`С первой попытки верно ${sc.got} из ${sc.max}. ${ok?'Отличная работа!':'Чтобы пройти квест, нужно 85% и больше с первой попытки.'}`));
  const rows=h('div',{class:'rows'});
  SECTIONS.forEach(s=>{const p=sc.per[s.id],miss=p.ok<p.max;const r=h('div',{class:'row'+(miss?' miss':'')},h('span',{},s.name()),h('span',{class:'tnum'},`${p.ok} / ${p.max}`));
    if(miss&&!ok)r.append(h('span',{class:'h',html:'Повтори: '+HINTS[s.id]}));rows.append(r);});
  box.append(rows);
  const ms=mistakes(); const d=new Date(rec.at);
  const rep=[`Хеллоуин-квест (5 класс)`,`Попытка: ${S.attempt}`,`С первой попытки: ${sc.got} из ${sc.max} (${sc.pct}%) — ${ok?'зачёт':'нужно повторить'}`,
    ...SECTIONS.map(s=>`• ${s.name()}: ${sc.per[s.id].ok}/${sc.per[s.id].max}`),
    ms.length?`Где ошибалась:\n${ms.map(m=>'  – '+m).join('\n')}`:'Ошибок не было',
    `Время: ${rec.mins} мин`,`Дата: ${d.toLocaleDateString('ru-RU')} ${d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}`,
    ...(S.history.length>1?[`Прошлые попытки: ${S.history.filter(x=>x.attempt!==S.attempt).map(x=>x.pct+'%').join(', ')}`]:[])].join('\n');
  box.append(h('p',{style:'margin:14px 0 0;font-weight:900'},'Скопируй результат и отправь учителю:'));
  const pre=h('div',{class:'report'},rep);
  const cb=h('button',{class:'btn green',onclick:async()=>{try{await navigator.clipboard.writeText(rep);cb.textContent='Скопировано! Вставь в чат учителю';}catch(e){const sel=getSelection(),rg=document.createRange();rg.selectNodeContents(pre);sel.removeAllRanges();sel.addRange(rg);cb.textContent='Текст выделен — нажми «Копировать»';}}},'Скопировать результат');
  box.append(pre,cb);
  box.append(h('div',{class:'navrow',style:'justify-content:center'},h('button',{class:ok?'btn ghost':'btn',onclick:restart},ok?'Пройти ещё раз с новыми числами':'Пройти заново с новыми числами')));
  view.append(box);
  if(ok) celebrate();
}
function restart(){const keep={history:S.history,attempt:S.attempt+1};S=Object.assign(fresh(),keep,{seed:(Date.now()*7919%2147483647)>>>0,step:0,start:Date.now()});G=generate(S.seed);lastFb=null;save();render();}
function celebrate(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||typeof confetti!=='function')return;
  const colors=['#ff8a1f','#9dff5a','#c79bff','#ffd23b','#ffffff'];const end=Date.now()+2500;
  (function f(){confetti({particleCount:6,angle:60,spread:60,origin:{x:0,y:.7},colors});confetti({particleCount:6,angle:120,spread:60,origin:{x:1,y:.7},colors});if(Date.now()<end)requestAnimationFrame(f);})();
  setTimeout(()=>confetti({particleCount:180,spread:110,origin:{y:.45},colors}),300);
}
render();
</script>
